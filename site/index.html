<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel BRG Watch</title>
  <link rel="stylesheet" href="style.css?v=20260901-6">
  <style>
    .summary{grid-template-columns:repeat(5,1fr)}
    .prices.three{grid-template-columns:repeat(3,1fr)}
    .chart .google-line{stroke:#23734d}.chart .marriott-line{stroke:#2469a0}
    .chart .google-dot{stroke:#23734d}.chart .marriott-dot{stroke:#2469a0}
    .chart-legend{display:flex;gap:12px;margin-top:8px;font-size:10px;color:#626b65}
    .chart-legend span:before{content:"";display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle}
    .booked-key:before{background:#d19823}.google-key:before{background:#23734d}.marriott-key:before{background:#2469a0}
    .source-links{display:flex;flex-wrap:wrap;gap:8px 18px}
    @media(max-width:1000px){.summary{grid-template-columns:repeat(2,1fr)}.prices.three{grid-template-columns:1fr}}
    @media(max-width:720px){.summary{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div><p class="eyebrow">DAILY HOTEL RATE MONITOR</p><h1>Hotel BRG Watch</h1></div>
    <p id="updated">불러오는 중…</p>
  </header>
  <main>
    <section class="notice"><strong>BRG 판단 원칙</strong><span>내 예약 총액, Google Hotels 후보가, Marriott 공식 공개가를 예약 통화(EUR/JPY)로 비교합니다. Google·Marriott 표시가는 세금 포함 범위가 다를 수 있으므로 링크에서 최종 총액과 객실명·침대·무료취소·결제 조건을 확인해야 합니다. 원화는 당일 환율 참고값입니다.</span></section>
    <section id="summary" class="summary"></section>
    <section id="cards" class="cards"></section>
    <section class="legend"><span><i class="good"></i> 예약가보다 저렴</span><span><i class="warn"></i> 조건 수동 확인</span><span><i class="bad"></i> 수집 오류</span></section>
  </main>
  <script type="module" src="app.js?v=20260901-6"></script>
</body>
</html>
