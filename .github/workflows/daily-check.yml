name: Daily hotel price check

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *" # 00:30 Asia/Seoul
    - cron: "17 21 * * *" # 06:17 Asia/Seoul fallback if GitHub delays the primary run
  push:
    branches: [main]
    paths:
      - "config/stays.json"
      - "site/data.json"
      - "site/app.js"
      - "site/brg.js"
      - "site/marriott-status.js"
      - "src/**"
      - "test/**"
      - "site/index.html"
      - "site/card-guide.html"
      - "site/trip.html"
      - "site/trip_osaka.html"
      - "site/trip_gunsan.html"
      - "site/pyeongchang.html"
      - "site/style.css"
      - ".github/workflows/daily-check.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hotel-brg-watch
  cancel-in-progress: true

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect-marriott]') || contains(github.event.head_commit.message, '[fallback-check]')
      - run: npx playwright install --with-deps chromium
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect-marriott]') || contains(github.event.head_commit.message, '[fallback-check]')
      - name: Collect Google Hotels and Marriott rates
        id: collection
        run: xvfb-run -a npm run collect:full
        continue-on-error: true
        env:
          MARRIOTT_ONLY: ${{ contains(github.event.head_commit.message, '[collect-marriott]') && '1' || '0' }}
          MARRIOTT_DEBUG: ${{ contains(github.event.head_commit.message, '[debug-osaka]') && '1' || '0' }}
          STAY_IDS: ${{ (contains(github.event.head_commit.message, '[debug-osaka]') || contains(github.event.head_commit.message, '[fallback-check]')) && 'osaka-four-points-flex' || '' }}
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect-marriott]') || contains(github.event.head_commit.message, '[fallback-check]')
      - name: Check parsers and BRG boundaries
        run: node --test test/config.test.mjs test/parser.test.mjs test/brg.test.mjs
      - name: Report collection failure separately from deployment
        if: steps.collection.outcome == 'failure'
        run: |
          echo '::warning::가격 수집 실패. 배포 성공은 수집 성공을 의미하지 않습니다. 마지막 유효값을 보존합니다.'
          echo '가격 수집 실패: Google/Marriott 상태 파일을 확인하세요. 배포와 수집 결과는 별개입니다.' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - name: Save collected history
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[collect-marriott]') || contains(github.event.head_commit.message, '[fallback-check]')
        run: |
          git config user.name "hotel-brg-bot"
          git config user.email "hotel-brg-bot@users.noreply.github.com"
          git add data/history.json data/*-status.json site/data.json
          git diff --cached --quiet || git commit -m "data: daily hotel prices"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
