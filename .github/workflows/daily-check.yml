name: Daily hotel price check

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *" # 00:30 Asia/Seoul
    - cron: "17 21 * * *" # 06:17 Asia/Seoul fallback if GitHub delays the primary run
  push:
    branches: [main]
    paths:
      - "site/app.js"
      - "site/index.html"
      - "site/style.css"
      - ".github/workflows/daily-check.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hotel-brg-watch
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: github.event_name != 'push'
      - run: npx playwright install --with-deps chromium
        if: github.event_name != 'push'
      - name: Collect Google Hotels and Marriott rates
        run: xvfb-run -a npm run collect:full
        if: github.event_name != 'push'
      - run: npm run build
      - name: Save collected history
        if: github.event_name != 'push'
        run: |
          git config user.name "hotel-brg-bot"
          git config user.email "hotel-brg-bot@users.noreply.github.com"
          git add data/history.json site/data.json
          git diff --cached --quiet || git commit -m "data: daily hotel prices"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
